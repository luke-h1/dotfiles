# ── general ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:Tc"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S ⋅ #W"
set -g display-time 2000

# ── prefix: C-a ───────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── splits / panes keep cwd ───────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

bind r source-file ~/.tmux.conf \; display "  reloaded"

# ── vi copy mode ──────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── catppuccin mocha ──────────────────────────────────────
%hidden BASE="#1e1e2e"
%hidden MANTLE="#181825"
%hidden CRUST="#11111b"
%hidden SURF0="#313244"
%hidden SURF1="#45475a"
%hidden TEXT="#cdd6f4"
%hidden SUBTEXT="#a6adc8"
%hidden MAUVE="#cba6f7"
%hidden BLUE="#89b4fa"
%hidden TEAL="#94e2d5"
%hidden PEACH="#fab387"
%hidden GREEN="#a6e3a1"
%hidden RED="#f38ba8"

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#{MANTLE},fg=#{TEXT}"
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#[fg=#{CRUST},bg=#{MAUVE},bold]  #S #[fg=#{MAUVE},bg=#{MANTLE}]#[default] "
set -g status-right "#[fg=#{SURF0}]#[fg=#{SUBTEXT},bg=#{SURF0}] #{?client_prefix,󰘳 ,}#{pane_current_command} #[fg=#{BLUE},bg=#{SURF0}]#[fg=#{CRUST},bg=#{BLUE},bold]  %H:%M #[fg=#{TEAL},bg=#{BLUE}]#[fg=#{CRUST},bg=#{TEAL},bold] 󰃭 %d %b "

setw -g window-status-format "#[fg=#{SURF1},bg=#{MANTLE}]#[fg=#{SUBTEXT},bg=#{SURF1}] #I #W #[fg=#{SURF1},bg=#{MANTLE}]"
setw -g window-status-current-format "#[fg=#{PEACH},bg=#{MANTLE}]#[fg=#{CRUST},bg=#{PEACH},bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#{PEACH},bg=#{MANTLE}]"
setw -g window-status-separator ""

set -g pane-border-style "fg=#{SURF0}"
set -g pane-active-border-style "fg=#{MAUVE}"
set -g message-style "bg=#{SURF0},fg=#{TEXT}"
set -g mode-style "bg=#{SURF1},fg=#{TEXT}"
